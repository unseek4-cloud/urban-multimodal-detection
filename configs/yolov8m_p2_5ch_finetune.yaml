seed: 42
device: auto

data:
  root: /root/autodl-fs/datasets
  train_split: splits/train.txt
  val_split: splits/val.txt
  train_ratio: 0.85
  num_workers: 12
  pin_memory: true
  persistent_workers: true
  strict_alignment: true
  depth_min_mm: 300
  depth_max_mm: 20000

model:
  architecture: yolov8m_p2_5ch
  mode: yolov8m_p2_5ch
  num_classes: 12
  pretrained: ""
  modality_dropout: 0.01
  verbose: false

augmentation:
  horizontal_flip: 0.5
  random_crop: 0.0
  crop_scale: [1.0, 1.0]
  rgb_brightness: 0.05
  rgb_contrast: 0.05
  hsv_h: 0.004
  hsv_s: 0.06
  hsv_v: 0.05
  ir_gamma: [0.90, 1.12]
  ir_gamma_probability: 0.15
  ir_noise_std: 0.006
  ir_noise_probability: 0.08
  multi_scale: [704]

training:
  epochs: 30
  batch_size: 6
  image_size: 704
  optimizer: AdamW
  learning_rate: 0.00005
  weight_decay: 0.005
  warmup_epochs: 1
  min_lr: 0.000001
  amp: true
  gradient_clip: 10.0
  label_smoothing: 0.0
  ema_decay: 0.9999
  val_interval: 2
  early_stopping_patience: 10
  log_interval: 20
  compile: false
  output_dir: outputs/v2_finetune
  resume: ""
  finetune: outputs/v2/ema_best.pt
  scheduler:
    type: cosine_with_plateau
    monitor: map50_95
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 0.000001

loss:
  assigner: tal
  tal_topk: 10
  tal_alpha: 0.5
  tal_beta: 6.0
  box: 7.5
  cls: 0.5
  dfl: 1.5
  class_counts: auto
  class_balance_beta: 0.999
  class_weight_min: 0.35
  class_weight_max: 3.0
  focal_gamma: 1.5
  negative_focal_alpha: 0.75

validation:
  confidence: 0.001
  nms_iou: 0.70
  max_detections: 100

prediction:
  confidence: 0.05
  nms_iou: 0.60
  max_detections: 100
  tta: true
  output: submission_v2_finetune

class_names:
  - person
  - boat
  - animal
  - seat
  - sign
  - bicycle
  - car
  - ball
  - light
  - garbage can
  - uav
  - tricycle
